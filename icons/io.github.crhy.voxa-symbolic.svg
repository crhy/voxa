  <title>Voxa</title>
  <circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.55"/>
  <path fill="currentColor" d="M6.19 3.75 L8.91 3.75 L12 14.25 L15.09 3.75 L17.81 3.75 L12 19.22 Z"/>
  <path fill="currentColor" d="M12 7 L13.4 8.6 L12 10.2 L10.6 8.6 Z"/>
</svg>
