id: io.github.crhy.voxa
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: voxa

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  # Lets the in-app "Install Ollama" action run `flatpak-spawn --host
  # pkexec sh -s` so the host's PolicyKit agent can prompt for a password
  # and install Ollama outside the sandbox. The app fetches the install
  # script itself over --share=network and only pipes the already-fetched
  # text to the privileged host process; it does not grant filesystem or
  # process access beyond this one D-Bus name.
  # Voice commands use the same host-spawn permission to run these programs
  # on the host: xdg-open (opening web pages), gio launch (launching apps),
  # xdotool (typing and key presses), wmctrl and flatpak kill (closing and
  # switching windows). xdotool and wmctrl must be installed on the host.
  - --talk-name=org.freedesktop.Flatpak
  # "Draft a report about X" writes a brand-new .odt into ~/Documents/Voxa
  # Drafts and opens it in LibreOffice for the user to review. Only the
  # documents directory is touched, and only so Voxa can create files there;
  # it cannot read or modify anything else on the host filesystem.
  - --filesystem=xdg-documents:create
  # Downloaded 3D avatar models live in ~/.local/share/voxa/avatars on the
  # host, which is invisible to the sandbox without this grant. Read-only:
  # Voxa only loads avatar .glb/.png files and never writes there.
  - --filesystem=xdg-data/voxa:ro

modules:
  - name: espeak-ng
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/espeak-ng/espeak-ng.git
        tag: 1.52.0
        commit: 4870adfa25b1a32b4361592f1be8a40337c58d6c
    build-commands:
      - ./autogen.sh
      - ./configure --prefix=/app --with-sonic=no --with-mbrola=no --with-pcaudiolib=no
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install

  # Generated with flatpak-pip-generator (committed; see requirements.txt note).
  - python3-requirements-flatpak.json

  - name: nvidia-cuda-runtime
    buildsystem: simple
    only-arches:
      - x86_64
    sources:
      - type: file
        # CUDA 12.8's libcublasLt object is larger than OSTree's 512 MiB
        # decompressed-object safety limit.  CUDA 12.6 keeps the same
        # libcublas.so.12 ABI while remaining safely importable by current
        # Flatpak/OSTree releases.
        url: https://developer.download.nvidia.com/compute/cuda/redist/libcublas/linux-x86_64/libcublas-linux-x86_64-12.6.4.1-archive.tar.xz
        sha256: ec682bac6387f9cdfd0c20b25a16cd6ed0b8b3b7ff42be9eaeb41828e3a72572
      - type: file
        url: https://developer.download.nvidia.com/compute/cuda/redist/cuda_cudart/linux-x86_64/cuda_cudart-linux-x86_64-12.6.77-archive.tar.xz
        sha256: f74689258a60fd9c5bdfa7679458527a55e22442691ba678dcfaeffbf4391ef9
    build-commands:
      - mkdir -p /app/lib/cuda
      - tar -xJf libcublas-*.tar.xz --no-same-owner
      - tar -xJf cuda_cudart-*.tar.xz --no-same-owner
      - install -Dm755 libcublas-*-archive/lib/libcublas.so.12.6.4.1 /app/lib/cuda/
      - install -Dm755 libcublas-*-archive/lib/libcublasLt.so.12.6.4.1 /app/lib/cuda/
      - install -Dm755 cuda_cudart-*-archive/lib/libcudart.so.12.6.77 /app/lib/cuda/
      - ln -sf libcublas.so.12.6.4.1 /app/lib/cuda/libcublas.so.12
      - ln -sf libcublasLt.so.12.6.4.1 /app/lib/cuda/libcublasLt.so.12
      - ln -sf libcudart.so.12.6.77 /app/lib/cuda/libcudart.so.12

  # nvidia-smi + NVML: the GNOME 50 runtime does not ship nvidia-smi and the
  # sandbox does not inherit the host's, so hardware.py's GPU probes (model
  # sizing + the top-right GPU/percent widgets) come back empty and the app
  # falls back to a tiny iGPU figure. Vendor the working pair into
  # /app/lib/nvml (mirrors the /app/lib/cuda layout). See
  # packaging/flatpak/nvml/SOURCE-NOTES.md for provenance and licensing.
  - name: nvidia-smi-libs
    buildsystem: simple
    only-arches:
      - x86_64
    sources:
      - type: file
        path: packaging/flatpak/nvml/nvidia-smi
      - type: file
        path: packaging/flatpak/nvml/libnvidia-ml.so.1
    build-commands:
      - install -d /app/lib/nvml
      - install -Dm755 nvidia-smi /app/lib/nvml/nvidia-smi
      - install -Dm755 libnvidia-ml.so.1 /app/lib/nvml/libnvidia-ml.so.1

  # Pre-rendered face packs for the 22 characters (mouth frames and blink patches): the "Medium" facial
  # quality. Kept out of the source tree because they are 120 MB of JPEGs; published as a data download.
  - name: voxa-faces
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/crhy/voxa/releases/download/faces-2/voxa-faces-2.tar.gz
        sha256: 3d15bef1c3f4f43f9e95e435aeed9008b572fb860550ed536d64d0230e7c510e
        strip-components: 0
    build-commands:
      - install -d /app/share/voxa/faces
      - cp -r . /app/share/voxa/faces/
      - find /app/share/voxa/faces -maxdepth 1 -type f -delete

  # Voxa's own AI engine: llama.cpp's llama-server, run inside the sandbox (no host install, no password).
  # Vulkan runs it on any NVIDIA, AMD or Intel card; the CPU builds for every x86-64 level are loaded at run
  # time, so it also runs well with no graphics card. Measured with the small brain (Qwen3.5-0.8B Q4_K_M)
  # in the GNOME 50 runtime: 468 tok/s on an RTX 4070 Ti SUPER, 89 tok/s on the CPU alone.
  - name: spirv-headers
    buildsystem: cmake-ninja
    config-opts:
      - -DSPIRV_HEADERS_ENABLE_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/KhronosGroup/SPIRV-Headers/archive/refs/tags/vulkan-sdk-1.4.321.0.tar.gz
        sha256: 5bbea925663d4cd2bab23efad53874f2718248a73dcaf9dd21dff8cb48e602fc
    cleanup:
      - '*'

  - name: llama-cpp
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      # This release does not put SPIRV-Headers on the Vulkan backend's include path itself.
      - -DCMAKE_CXX_FLAGS=-I/app/include
      - -DGGML_VULKAN=ON
      - -DGGML_NATIVE=OFF
      - -DGGML_BACKEND_DL=ON
      - -DGGML_CPU_ALL_VARIANTS=ON
      - -DBUILD_SHARED_LIBS=ON
      - -DLLAMA_CURL=OFF
      - -DLLAMA_BUILD_TESTS=OFF
      - -DLLAMA_BUILD_EXAMPLES=OFF
      - -DLLAMA_BUILD_SERVER=ON
    sources:
      - type: archive
        url: https://github.com/ggml-org/llama.cpp/archive/refs/tags/v0.7.0.tar.gz
        sha256: 55d67acf3ad2ad747a9bbeb75f9f0e173dbcc0d1753a471038a90c819421c5e1
    post-install:
      # Keep the server only; the other tools are not used by Voxa.
      - find /app/bin -name 'llama-*' ! -name llama-server -delete
      - rm -f /app/bin/llama
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig

  - name: voxa
    buildsystem: simple
    sources:
      # List the application inputs explicitly. A broad `path: .` snapshot can
      # absorb local build trees and caches when building inside the checkout.
      - type: dir
        path: voxa
        dest: voxa
      - type: file
        path: voxa.py
      - type: dir
        path: packaging/flatpak
        dest: packaging/flatpak
      - type: file
        path: io.github.crhy.voxa.desktop
      - type: file
        path: io.github.crhy.voxa.metainfo.xml
      - type: dir
        path: icons
        dest: icons
    build-commands:
      - install -d /app/lib/voxa
      - install -Dm755 voxa.py /app/lib/voxa/voxa.py
      # Copy the whole package recursively so subpackages (voxa/ui, ...) are
      # included, then strip __pycache__ so the payload stays clean.
      - cp -r voxa /app/lib/voxa/
      - find /app/lib/voxa -name __pycache__ -prune -exec rm -rf {} +
      - install -Dm755 packaging/flatpak/voxa /app/bin/voxa
      - install -Dm755 packaging/flatpak/voxa-host-node /app/bin/voxa-host-node
      - install -Dm755 packaging/flatpak/voxa-backup /app/bin/voxa-backup
      - install -Dm644 io.github.crhy.voxa.desktop /app/share/applications/io.github.crhy.voxa.desktop
      - install -Dm644 io.github.crhy.voxa.metainfo.xml /app/share/metainfo/io.github.crhy.voxa.metainfo.xml
      - install -Dm644 icons/io.github.crhy.voxa.png /app/share/icons/hicolor/256x256/apps/io.github.crhy.voxa.png
      - install -Dm644 icons/io.github.crhy.voxa.png /app/share/icons/hicolor/256x256/apps/voxa.png
