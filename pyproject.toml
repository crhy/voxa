[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voxa"
# The version is defined once, in voxa/__init__.py (APP_VERSION); see tools/release_check.py.
dynamic = ["version"]
description = "Native Linux voice dictation and local AI desktop application"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.2,<2",
  "numpy>=2.0,<3",
  "edge-tts>=7.2,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[project.scripts]
voxa = "voxa.__main__:main"
voxa-backup = "voxa.backup:main"
voxatest = "voxatest.__main__:main"
voxatest-gui = "voxatest.application:main"

[tool.setuptools.packages.find]
include = ["voxa*"]

[tool.setuptools.package-data]
voxatest = ["data/*.json"]

[tool.setuptools.dynamic]
# Name the package initializer explicitly.  The repository also has a legacy
# top-level voxa.py launcher; asking setuptools for ``voxa.APP_VERSION`` can
# resolve that launcher instead of the package in isolated wheel builds.
version = {attr = "voxa.__init__.APP_VERSION"}
