name: Test and build Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # voxa.APP_VERSION is the single source of the version. This fails the build if
      # pyproject, the AppStream release entry or a release tag disagree with it, and
      # derives the versioned bundle name (Voxa-<version>-x86_64.flatpak) used below.
      - name: Check release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python tools/release_check.py --tag "$GITHUB_REF_NAME"
          else
            python tools/release_check.py
          fi
          echo "artifact=$(python tools/release_check.py --print artifact)" >> "$GITHUB_OUTPUT"
      - name: Install test tools
        run: python -m pip install --upgrade -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q voxa voxa.py
      - name: Lint
        run: ruff check voxa tests voxa.py
      - name: Unit tests
        run: python -m pytest -q
      - name: Validate AppStream, desktop file and Flatpak manifest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq appstream desktop-file-utils
          python -m pip install --quiet pyyaml
          appstreamcli validate --no-net io.github.crhy.voxa.metainfo.xml
          desktop-file-validate io.github.crhy.voxa.desktop
          python -c "import yaml; yaml.safe_load(open('io.github.crhy.voxa.yml')); print('manifest parses')"

  # The GTK-independent tests above skip the interface. This job runs the UI and
  # window tests for real on a virtual display. It uses a Fedora container because
  # Voxa needs libadwaita 1.6+ (Adw.Spinner, Adw.ToolbarView...), newer than Ubuntu's.
  gtk-tests:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install GTK 4, libadwaita, Xvfb and test tools
        run: |
          dnf -y install git python3-gobject gtk4 libadwaita gstreamer1 python3-numpy python3-pytest \
            xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers adwaita-icon-theme
      - uses: actions/checkout@v4
      - name: UI and window tests
        # No GPU on the runner: use GTK's software renderer and Mesa's software GL.
        env:
          GSK_RENDERER: cairo
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a python3 -X faulthandler -m pytest -q -s tests/test_ui_*.py tests/test_assistant_*.py tests/test_window_*.py

  flatpak:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      # Stable cache key: a commit sha is unique per run and never hits a cache
      # from a previous build, so key on the manifest contents plus runtime
      # version instead.
      - name: Compute Flatpak cache key
        shell: bash
        run: |
          runtime=$(grep -m1 'runtime-version:' io.github.crhy.voxa.yml | tr -d "' ")
          hash=$(sha256sum io.github.crhy.voxa.yml | cut -c1-16)
          echo "cache-key=flatpak-builder-${runtime}-${hash}" >> "$GITHUB_OUTPUT"
        id: flatpak-cache
      # python3-requirements-flatpak.json is committed. To regenerate it after
      # changing packaging/flatpak/requirements.txt, run flatpak-pip-generator
      # with org.gnome.Sdk//50 and the same --prefer-wheels/--wheel-arches args,
      # then merge requests, urllib3 and charset_normalizer into the
      # python3-faster-whisper module (flatpak-pip-generator splits them out when
      # huggingface-hub is pinned below the latest version).
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.crhy.voxa.yml
          branch: master
          repo-dir: voxa-repo
          build-bundle: false
          upload-artifact: false
          cache-key: ${{ steps.flatpak-cache.outputs.cache-key }}
          # Do NOT mirror screenshots to https://dl.flathub.org/media. That
          # option rewrites every screenshot URL in the exported AppStream to
          # Flathub's media CDN, but this application is published from its
          # own repository rather than to Flathub, so nothing is ever
          # uploaded to those paths. The rewritten URLs returned 404 and the
          # app showed with no screenshots at all (crhy/spaced#181). Leaving
          # it unset keeps the raw githubusercontent URLs declared in the
          # metainfo, which resolve.
      # Voxa's canonical update repository is its own GitHub Pages site (see
      # docs/RELEASING.md). Publishing the repository there is a separate release step.
      - name: Create updateable release bundle
        run: >-
          flatpak build-bundle
          --arch=x86_64
          --repo-url=https://crhy.github.io/voxa/flatpak-repo/
          --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          voxa-repo
          ${{ needs.test.outputs.artifact }}
          io.github.crhy.voxa
          master
      - name: Verify bundle can be imported by current OSTree
        shell: bash
        run: |
          set -euo pipefail
          probe=$(mktemp -d)
          repo="$probe/repo"
          checkout="$probe/checkout"
          ostree init --repo="$repo" --mode=archive-z2
          flatpak build-import-bundle --no-update-summary "$repo" "${{ needs.test.outputs.artifact }}"
          ref=app/io.github.crhy.voxa/x86_64/master
          ostree --repo="$repo" refs | grep -Fx "$ref"
          ostree --repo="$repo" checkout --user-mode "$ref" "$checkout"
          test -f "$checkout/export/share/metainfo/io.github.crhy.voxa.metainfo.xml"
          test -s "$checkout/export/share/icons/hicolor/256x256/apps/io.github.crhy.voxa.png"
          flatpak build-update-repo "$repo"
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: Voxa-Flatpak
          path: ${{ needs.test.outputs.artifact }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Voxa-Flatpak
      - uses: softprops/action-gh-release@v2
        with:
          name: Voxa ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: ${{ needs.test.outputs.artifact }}
