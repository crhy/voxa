# Gates for the Voxa hearing bench.
#
# Roadmap B3 creates this file with EVERY metric the shared brief names and NO threshold yet,
# so `python -m voxa.bench run` reports every metric and fails nothing. Roadmap B5 records the
# baseline thresholds here after the first honest baseline run; the numbers a single task gates
# on live in that task's file, never in this one - loosening a threshold here to make a run pass
# is forbidden by the brief.
#
# `direction` is the direction a better result moves in. A metric with no threshold line is
# pending. A metric reported with value null (this stage cannot measure it) never fails a gate.

[[metric]]
name = "erle_fst_median_db"
unit = "dB"
direction = ">="

[[metric]]
name = "erle_fst_p10_db"
unit = "dB"
direction = ">="

[[metric]]
name = "nearend_atten_dt_db"
unit = "dB"
direction = "<="

[[metric]]
name = "align_err_p90_ms"
