# Gates for the Voxa hearing bench.
#
# Roadmap B3 created this file with EVERY metric the shared brief names and NO threshold yet, so
# `python -m voxa.bench run` reported every metric and failed nothing. Roadmap B5 (this file, as
# recorded on 2026-11-18 from `voxa/bench/baseline.json`) sets one threshold per metric the baseline
# could measure. The numbers a single task gates on live in that task's file, never here - and
# loosening a threshold here to make a run pass is forbidden by the shared brief: a threshold may
# only ever be tightened, by the task that genuinely improves the metric.
#
# THE RATCHET RULE (roadmap B5: "set each gate to the stricter of the proposed target and
# 'baseline minus nothing', so no later task can regress any metric"): the threshold is the
# baseline's own 95 % bootstrap CI bound on the BAD side, taken from the SMOKE suite in the runner's
# DEFAULT echo mode (`voxa`, `voxa/bench/runner.py:631`). A later task passes while its value stays
# inside the spread the baseline already had; a value outside it is a regression, not noise. Where the
# proposed long-term target is already stricter than today (it always is - see the `target:` comments,
# from the report's evaluation table and handoff 8.4), the target is written as a comment so the
# ratchet cannot hide it, and the task that owns it moves the line.
#
# The thresholds are the DEFAULT mode's ratchet. The other modes are recorded in `baseline.json`
# (`python -m voxa.bench baseline check REPORT` compares a fresh run with its own mode's entry);
# running a non-default mode against this file is a comparison, not a pass/fail, and says so in
# docs/hearing-bench-baseline.md.
#
# `direction` is the direction a better result moves in. A metric with no threshold line is pending:
# either the baseline could not measure it in the default mode (value null - it never fails a gate, and
# the reason is in `metrics.UNMEASURED` or in the comment), or the mode produced no samples for it.

[[metric]]
name = "erle_fst_median_db"
unit = "dB"
direction = ">="
threshold = 0.0
# baseline 0.0 ci [0.0, 0.0] (372 far-end frames): the canceller removes NOTHING on Voxa's own echo.
# target: >= 25 dB converged (roadmap task 2; task 3 holds it under +/-100 ppm drift, task 10 under a
# device change).

[[metric]]
name = "erle_fst_p10_db"
unit = "dB"
direction = ">="
threshold = -0.08
# baseline -0.038 ci [-0.08, -0.01]: the worst 10 % of far-end frames get slightly MORE energy, not less.
# target: >= 15 dB (roadmap task 2's P10 gate).

[[metric]]
name = "nearend_atten_dt_db"
unit = "dB"
direction = "<="
threshold = 11.77651
# baseline 8.637 ci [5.9698, 11.7765] (31 double-talk clips): the user's own voice is pushed down 8.6 dB
# while her echo is left untouched - the worst thing the pipeline does today.
# target: <= 3 dB (roadmap task 2's near-end attenuation gate).

[[metric]]
name = "align_err_p90_ms"
unit = "ms"
direction = "<="
threshold = 2.0
# roadmap task 1's gate number, from that task's file (not a baseline ratchet; pinned by
# tests/test_bench_metrics.py): the render timeline's predicted play time against the sink's real
# one, P90 over clips of the P90 over chunks. Measured on a simulated sink of 40 ms latency and
# 1 ms per-buffer scheduling jitter, 20 ms capture latency (voxa/bench/sinksim.py): 0.92 ms
# [0.913, 0.929] over the 42 smoke clips that have playback. The same instrument with the sink
# never queried - the pre-task-1 assumption that the buffer being written is audible now - reports
# 43 ms with no jitter and 147 ms with it.
# f168 (shipping lock, default mode): smoke 0.0205 ms ci [0.0195, 0.0218], full 0.0215 - two orders
# under this floor. The line does not move here: it is task 1's proposed gate number, not a B5
# baseline ratchet, and task 1 owns moving it (the ratchet note at the top of this file).

[[metric]]
name = "fst_transcript_rate"
unit = "fraction"
direction = "<="
threshold = 0.0
# baseline 0.0 ci [0.0, 0.0] (9 Voxa-only clips with a full reply): the cleaned stream yields no
# transcript whose words could be checked. It is a floor, not a success - see the doc.
# target: <= 0.01 (roadmap task 4: "FST transcript rate <= 1 %", i.e. her own words must stop surviving).

[[metric]]
name = "echo_leak_word_rate"
unit = "fraction"
direction = "<="
threshold = 0.213043
# baseline 0.1652 ci [0.1174, 0.213] (230 words in the cleaned stream): 16.5 % of the words the pipeline
# hands on are Voxa's own echo. target: <= 0.001 (roadmap task 4: "echo-leak words <= 0.1 %"), then
# halved again by task 7's word-timed own-speech filter.

[[metric]]
name = "false_bargein_per_hour"
unit = "events/hour"
direction = "<="
threshold = 0.0
# baseline 0.0 ci [0.0, 0.0] (42 Voxa-only clips, 108.45 s of her playback): in the DEFAULT mode nothing
# triggers at all, because nothing gets through - the same events are 132.8/h in echo mode off.
# target: 0 on smoke and <= 0.5/h on full (roadmap task 5); handoff 8.4 wants zero false playback stops
# in 10,000 varied Voxa-only trials.

[[metric]]
name = "missed_bargein_rate"
unit = "fraction"
direction = "<="
threshold = 1.0
# baseline 1.0 ci [1.0, 1.0] (27 attempts): EVERY intended interruption is missed in the DEFAULT mode.
# target: <= 0.02 at SER >= -5 dB (roadmap task 5); handoff 8.4 wants >= 99 % interruption recall,
# i.e. <= 0.01 missed, with difficult quiet/far-field cells reported separately.

[[metric]]
name = "duck_latency_p50_ms"
unit = "ms"
direction = "<="
# no threshold: value null in the DEFAULT mode (0 ducks - see missed_bargein_rate). In echo mode off the
# baseline is 1212 ms ci [538, 1667]. target: <= 300 ms (roadmap task 8), <= 200 ms median (handoff 8.4).

[[metric]]
name = "duck_latency_p90_ms"
unit = "ms"
direction = "<="
# no threshold: null in the DEFAULT mode; echo mode off baseline 1681 ms ci [1302, 2040].
# target: <= 600 ms (roadmap task 8).

[[metric]]
name = "interrupt_stop_rate"
unit = "fraction"
direction = "<="
threshold = 0.0
# baseline 0.0 ci [0.0, 0.0] (9 Voxa-only replies): her own playback never stops herself in the DEFAULT
# mode - only because the gate never opens. echo mode off is 0.2222 [0, 0.556]: 2 of 9 replies self-stopped.
# target: 0 (handoff 8.4: zero false playback stops in 10,000 varied Voxa-only trials).

[[metric]]
name = "backchannel_resume_rate"
unit = "fraction"
direction = ">="
threshold = 1.0
# baseline 1.0 ci [1.0, 1.0] (2 back-channel clips): the only two attempts in this mode resume, on a
# sample of 2 - the CI is the whole range in echo mode off ([0, 1]).
# target: >= 0.95 (roadmap task 8: ">= 95 % resume on backchannels").

[[metric]]
name = "protected_word_keep_rate"
unit = "fraction"
direction = ">="
threshold = 0.113636
# baseline 0.2273 ci [0.1136, 0.3636] (44 protected words): 10 of 44 words that must never be stripped
# survive today. target: 1.0 (roadmap task 7: "protected words 100 % kept").

[[metric]]
name = "user_recall_nst"
unit = "fraction"
direction = ">="
threshold = 0.509091
# baseline 0.6091 ci [0.5091, 0.6909] (110 user words on near-end-only clips): the canceller and the
# reference mask eat 39 % of the user's words even when NOTHING is playing to cancel.
# target: >= 0.99 (handoff 8.4: at least 99 % user-onset recall in the declared normal-use range).

[[metric]]
name = "dt_wer_penalty_pts"
unit = "points"
direction = "<="
threshold = 352.447512
# baseline 125.2 points ci [27.4, 352.4] (33 double-talk clips): double-talk costs 125 WER points more
# than near-end-only speech. The CI stays wide in this mode even on the full suite (116.4 [19.7, 265.5])
# because the double-talk WER itself swings between clips; echo mode off is 54.5 [39.3, 68.5].
# target: <= 3 points (roadmap task 4's DT WER penalty gate).

[[metric]]
name = "first_word_trunc_cold"
unit = "fraction"
direction = "<="
threshold = 1.0
# baseline 1.0 ci [1.0, 1.0] (3 cold-start clips): the first word is lost on EVERY cold start.
# target: <= 0.01 (roadmap task 6: "first-word truncation <= 1 % cold").

[[metric]]
name = "first_word_trunc_bargein"
unit = "fraction"
direction = "<="
# no threshold: null in the DEFAULT mode (no barge-in happens there); echo mode off baseline is 1.0
# ci [1, 1] - the first word is lost on every accepted interruption too.
# target: <= 0.03 (roadmap task 6: "<= 3 % barge-in").

[[metric]]
name = "premature_cutoff_rate"
unit = "fraction"
direction = "<="
threshold = 0.178571
# baseline 0.0714 ci [0, 0.1786] (28 endpoint samples): 2 of 28 turns are cut before the user finishes.
# target: <= 0.01 (roadmap task 9; handoff 8.4 "premature replies below a predeclared threshold, below
# 1 % is reasonable to test").

[[metric]]
name = "ep50_ms"
unit = "ms"
direction = "<="
threshold = 1021.414664
# baseline 913.9 ms ci [855.5, 1021.4] (28 endpoint samples). target: <= 700 ms (roadmap task 9).

[[metric]]
name = "ep90_ms"
unit = "ms"
direction = "<="
threshold = 1318.920546
# baseline 1159.5 ms ci [1081.5, 1318.9] (28 endpoint samples). target: <= 1200 ms (roadmap task 9).

[[metric]]
name = "delay_est_err_ms"
unit = "ms"
direction = "<="
threshold = 17.357955
# baseline 5.8 ms ci [0.011, 17.358] (11 delay estimates): the estimate is right when it is made at all -
# it is made on 11 of 48 clips only (roadmap task 3 makes it continuous).
# f168: the shipping lock measures 0.0649 ms on smoke (value) but its 95 % bootstrap CI reaches
# 46.4126 ms (the honest reconvergence-window frames of f163 on the few clips that step), and the
# ratchet rule keeps the STRICTER of the current 17.357955 and that bound - the line does not move.
# The full-suite figure is 0.0727 ms [0.0707, 0.0752] (docs/hearing/frontier.md, f168 row); the
# smoke tail is what a threshold ratchet must survive, so the next tightening belongs to a task
# that narrows that tail, and never loosen it.
# target: <= 1 ms std per take (roadmap B4's real-corpus gate; task 3 re-estimates every utterance).

[[metric]]
name = "drift_erle_loss_db"
unit = "dB"
direction = "<="
threshold = 0.153642
# baseline 0.08 dB ci [0.016, 0.154] (264 far-end frames of >=100 ppm drift vs steady clips): drift costs
# nothing today only because the canceller removes nothing anyway.
# target: <= 3 dB (roadmap task 3: "ERLE at +/-100 ppm within 3 dB of no-drift").

[[metric]]
name = "reconverge_s"
unit = "s"
direction = "<="
# no threshold: null in the DEFAULT mode - 11 delay re-estimates never bring ERLE back to 15 dB inside
# the clip (`run.reconverge_unrecovered`), so there is no recovery time to measure.
# target: <= 2 s after a 50 ms delay step (roadmap task 3) and after a device switch (task 10).

[[metric]]
name = "cpu_core_share"
unit = "cores"
direction = "<="
threshold = 0.775161
# The metric changed meaning in task f129 (see the docstring at voxa/bench/metrics.py
# cpu_core_share_samples and tasks/notes-f129-voxa-hear-t2-aec3.md): it measured ASR seconds over
# wall seconds, which the gate it carries ("<= 10 % of one core", roadmap task 2) has never been
# about - the recogniser is not a canceller. It now divides ECHO-stage seconds by clip audio
# seconds. The threshold below is the OLD baseline bound: it was never re-loosened for the new
# meaning, it only still passes because echo stages are far below it. Under the new meaning the
# DEFAULT mode (voxa NLMS + mask) measures 0.xxx in the f129 baseline run; tighten this line to
# that bound when the next task re-records the baseline.
# target: <= 0.1 core (roadmap task 2: "<= 10 % of one core"; task 12 allows <= 0.25 for an experiment).
# (The old ASR-based reading of 0.731 ci [0.6840, 0.7752] from three identical runs is still in
# run.asr_processing_seconds / run.asr_audio_seconds if anyone needs it.)

[[metric]]
name = "erle_music_loss_db"
unit = "dB"
direction = "<="
threshold = 1.0
# roadmap task 1's gate number, from that task's file (not a baseline ratchet). It is the SIZE of the
# move in ERLE when a second application plays through the same speakers; the reference is Voxa's own
# render. Measured 0.185 dB [0.0, 0.554] over the 42 smoke clips that have playback. The same
# instrument with the whole-sink monitor as the reference moves by 7.5 dB (run.render_timeline.
# erle_monitor_music_loss_db), which is how the report expects the monitor to fail this gate.
# B3 wrote direction ">=" for a metric its own comment describes as "within 1 dB" - a magnitude, for
# which smaller is better. Task 1 corrected the direction to "<="; no threshold had ever used it.

[[metric]]
name = "self_command_rate"
unit = "fraction"
direction = "<="
threshold = 0.0
# baseline 0.0 ci [0.0, 0.0] (9 Voxa-only clips): her own voice has not become a command in this mode.
# echo mode off is also 0.0, and `pair_accuracy` shows the matched pair that says the SAME words is
# still decided wrong - a floor, not a success.
# target: 0 (handoff 8.4: zero self-generated commands in 10,000 varied Voxa-only trials).

[[metric]]
name = "self_pause_per_hour"
unit = "events/hour"
direction = "<="
threshold = 0.0
# baseline 0.0 ci [0.0, 0.0] (9 Voxa-only clips, 22.29 s of her own playback): no duck/pause/stop of her
# own stream in the DEFAULT mode; echo mode off is 484.6/h ci [0, 891.3] - 3 cessations in those 22.3 s.
# target: 0 (handoff 8.4: zero events in 100 hours, a ~0.03/h one-sided 95 % Poisson bound).

[[metric]]
name = "turn_retention_rate"
unit = "fraction"
direction = ">="
# no threshold: null in the DEFAULT mode (no accepted overlap span exists there); echo mode off baseline
# is 0.0 ci [0, 0] over 17 spans - every accepted span loses or duplicates frames.
# target: 1.0 with zero transport loss/duplication (handoff 8.4: accepted audio promoted exactly once).

[[metric]]
name = "user_word_deletion_rate"
unit = "fraction"
direction = "<="
threshold = 0.360104
# baseline 0.3161 ci [0.272, 0.3601] (386 user words): 32 % of the user's known words are gone before
# the recogniser sees them. target: 0 - the programme's goal is "hears EVERY word"; roadmap task 7 holds
# the double-talk recall drop to <= 0.5 point while it strips echo.

[[metric]]
name = "pair_accuracy"
unit = "fraction"
direction = ">="
threshold = 0.0
# baseline 0.3333 ci [0.0, 1.0] (3 matched pairs): 1 of 3 pairs of "the same words said by Voxa alone"
# and "said by the user over Voxa" is decided right on BOTH sides. The bound is 0 because the CI of 3
# samples spans the whole range - it holds today and any later task can only raise it.
# target: 1.0 (handoff 8.4: keep-and-yield matched pairs both correct; this is the metric that kills
# always-stop and never-stop policies).

[[metric]]
name = "stop_latency_p50_ms"
unit = "ms"
direction = "<="
# no threshold: null in the DEFAULT mode (no cessation of playback there); echo mode off baseline 1212
# ms ci [538, 1667]. target: <= 200 ms median (handoff 8.4's initial stop-latency target).

[[metric]]
name = "stop_latency_p95_ms"
unit = "ms"
direction = "<="
# no threshold: null in the DEFAULT mode; echo mode off baseline 1861 ms ci [1491, 2040].
# target: <= 350 ms (handoff 8.4's p95 stop-latency target).

[[metric]]
name = "transport_drop_count"
unit = "count"
direction = "<="
# no threshold: value null in every mode - the offline runner has no queue to drop
# (`metrics.UNMEASURED`: the live appsinks are task A4). target: 0 (handoff 8.4: zero transport loss or
# duplication in accepted user spans).
